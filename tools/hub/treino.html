<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Treino+</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--txt:#e8eaf0;--mut:#8b93a5;--ac:#3ddc97;--ac2:#4aa3ff;--bad:#ff6b6b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt);padding:14px;max-width:760px;margin:auto}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 10px;color:var(--ac)}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:15px}
.tabs button.on{background:var(--ac);color:#06210f;border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input,select{background:#0c0e12;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px;font-size:15px;width:100%}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1}
.btn{background:var(--ac);color:#06210f;border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer}
.btn.alt{background:var(--card);color:var(--txt);border:1px solid var(--line)}.btn.bad{background:none;color:var(--bad);border:1px solid var(--bad);padding:4px 9px;font-size:13px}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.item:last-child{border:0}
.mut{color:var(--mut);font-size:13px}.big{font-size:44px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:8px}.stat{flex:1;background:#0c0e12;border-radius:10px;padding:10px;text-align:center}.stat b{display:block;font-size:20px;color:var(--ac2)}
textarea{background:#0c0e12;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px;font-size:14px;width:100%;margin-top:8px;font-family:inherit}
.sug{font-size:13px;color:#cfe9ff;background:#14263a;border-left:3px solid var(--ac2);border-radius:8px;padding:7px 10px;margin:6px 0}.pr{color:#ffd54f;font-weight:700}
.mb{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.mb span:first-child{flex:0 0 92px}.mb .tr{flex:1;height:12px;background:#0c0e12;border-radius:6px;overflow:hidden}.mb .tr i{display:block;height:100%;border-radius:6px}.mb b{flex:0 0 28px;text-align:right}
canvas{width:100%;height:180px;background:#0c0e12;border-radius:10px}.hide{display:none}
</style></head><body>
<h1>💪 Treino+</h1><div id='gl' class=mut style='margin-bottom:6px'></div><div class=mut style='margin-bottom:8px'>Guardado no servidor, ligado ao peso do Gym.</div>
<div class="tabs"><button data-t="log" class="on">Treino</button><button data-t="timer">Descanso</button><button data-t="peso">Peso</button><button data-t="hist">Histórico</button></div>

<section id="log"><div class="card"><h2>Registar série</h2>
<div class="row"><select id="plan"></select><select id="ex"></select></div>
<div class="row"><input id="kg" type="number" step="0.5" placeholder="Carga (kg)"><input id="reps" type="number" placeholder="Repetições"><input id="rpe" type="number" min="1" max="10" placeholder="Esforço 1-10"></div>
<div class="mut" id="e1" style="margin:2px 0 6px"></div><div id="sug" class="sug" style="display:none"></div>
<button class="btn" id="add">Adicionar série</button> <button class="btn alt" id="plt" type="button">Discos</button> <span class="mut" id="msg"></span><div class="mut" id="pl" style="margin-top:6px"></div>
<textarea id="nt" rows="2" maxlength="300" placeholder="Nota deste exercício (regulação do banco, técnica, sensações…)"></textarea></div>
<div class="card"><h2>Séries esta semana</h2><div id="wk"></div><div class="mut">Alvo para crescer: 10 a 20 séries por grupo por semana.</div></div>
<div class="card"><h2>Hoje</h2><div id="today"></div></div></section>

<section id="timer" class="hide"><div class="card"><h2>Descanso entre séries</h2><div class="big" id="clock">01:30</div>
<div class="row"><button class="btn alt" data-s="60">1:00</button><button class="btn alt" data-s="90">1:30</button><button class="btn alt" data-s="120">2:00</button><button class="btn alt" data-s="180">3:00</button></div>
<div class="row"><button class="btn" id="go">Iniciar</button><button class="btn alt" id="stop">Parar</button></div></div></section>

<section id="peso" class="hide"><div class="card"><h2>Peso corporal</h2>
<div class="row"><input id="w" type="number" step="0.1" placeholder="kg"><input id="wd" type="date"><button class="btn" id="addw" style="flex:0 0 110px">Guardar</button></div>
<div class="row"><input id="goal" type="number" placeholder="Meta (kg)"></div><canvas id="cv" width="700" height="180"></canvas>
<div class="stats" style="margin-top:10px"><div class="stat"><span class="mut">Atual</span><b id="s1">–</b></div><div class="stat"><span class="mut">Meta</span><b id="s2">–</b></div><div class="stat"><span class="mut">Faltam</span><b id="s3">–</b></div></div></div></section>

<section id="hist" class="hide"><div class="card"><h2>Resumo</h2><div class="stats"><div class="stat"><span class="mut">Treinos</span><b id="h1">0</b></div><div class="stat"><span class="mut">Séries</span><b id="h2">0</b></div><div class="stat"><span class="mut">Volume (kg)</span><b id="h3">0</b></div></div></div>
<div class="card"><h2>🏆 Recordes</h2><div id="prs"></div></div>
<div class="card"><h2>Últimos treinos</h2><div id="hl"></div><br><button class="btn alt" id="exp">Exportar JSON</button> <button class="btn bad" id="clr">Apagar tudo</button></div></section>

<script>
const PLANS=__PLANS__;
fetch('/finance/glucose/now').then(r=>r.json()).then(j=>{if(j&&j.v)document.getElementById('gl').textContent='Glicose '+Math.round(j.v)+' mg/dL'+(j.age<5400?'':' (leitura antiga)')+(j.v<100?' · come hidratos antes de treinar':j.v>250?' · convém adiar o treino intenso':'')}).catch(()=>{});let D={sets:[],weights:[],goal:null,notes:{}};const API='__API__';
const store={set(d){D=d;clearTimeout(store.t);store.t=setTimeout(()=>fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(D)}).catch(()=>{}),300)}};
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
 ['log','timer','peso','hist'].forEach(s=>$(s).classList.toggle('hide',s!==b.dataset.t));render()});
Object.keys(PLANS).forEach(p=>$('plan').add(new Option(p,p)));
function fillEx(){$('ex').innerHTML='';PLANS[$('plan').value].forEach(e=>$('ex').add(new Option(e,e)))}$('plan').onchange=()=>{fillEx();exInfo()};$('ex').onchange=exInfo;fillEx();
const e1=(kg,r)=>kg>0&&r>0?kg*(1+r/30):0;
const MUS=[['Glúteos',/gl[uú]te|hip thrust|coice|abdu[cç][aã]o|b[uú]lgaro/i],['Peito',/supino|crucifixo|peck|flex[oõ]es|peito/i],['Costas',/puxada|remada|pulldown|costas|barra fixa/i],['Ombros',/ombro|eleva[cç][aã]o lateral|militar|arnold/i],['Pernas',/agacha|leg press|extensora|flexora|afundo|peso morto|cadeira|g[eé]meos|panturrilha/i],['Braços',/b[ií]ceps|tr[ií]ceps|rosca|curl|franc[eê]s/i],['Abdominais',/abdominal|prancha|crunch|eleva[cç][aã]o de pernas|pallof|dead bug|roda/i]];
const muscle=ex=>{for(const [n,r] of MUS)if(r.test(ex))return n;return null};
function weekStart(){const d=new Date(),k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return d.toISOString().slice(0,10)}
function plates(t){const bar=20;if(!(t>bar))return 'Só a barra ('+bar+' kg).';let rem=(t-bar)/2;const out=[];[25,20,15,10,5,2.5,1.25].forEach(p=>{const n=Math.floor(rem/p+1e-9);if(n>0){out.push(n+'×'+p);rem-=n*p}});return 'Cada lado: '+out.join(' + ')+(rem>0.01?' (faltam '+(rem*2).toFixed(2)+' kg)':'')+' · barra de '+bar+' kg.'}
function exInfo(){const ex=$('ex').value,td=today();D.notes=D.notes||{};$('nt').value=D.notes[ex]||'';
 const prev=D.sets.filter(s=>s.ex===ex&&s.d<td);const box=$('sug');if(!prev.length){box.style.display='none';return}
 const day=prev.map(s=>s.d).sort().pop(),ss=prev.filter(s=>s.d===day),mx=Math.max(...ss.map(s=>s.kg)),top=ss.filter(s=>s.kg===mx);
 const avg=top.reduce((a,s)=>a+s.reps,0)/top.length,rp=top.filter(s=>s.rpe),ar=rp.length?rp.reduce((a,s)=>a+s.rpe,0)/rp.length:null;
 let tip;if(!(mx>0))tip='Tenta mais uma repetição por série.';else if(top.every(s=>s.reps>=12)||(avg>=10&&(ar===null||ar<=8))){const nk=Math.max(mx+0.5,Math.round(mx*1.025*2)/2);tip='Sobe para '+nk+' kg (+2,5%).'}else if(avg<6)tip='Mantém a carga e procura mais repetições antes de subir.';else tip='Mantém '+mx+' kg e tenta mais uma repetição por série.';
 box.style.display='';box.innerHTML='Última vez ('+day+'): <b>'+top.length+' × '+Math.round(avg*10)/10+(mx>0?' @ '+mx+' kg':'')+'</b>'+(ar?' · esforço '+ar.toFixed(1):'')+'.<br>Sugestão: <b>'+tip+'</b>'}
function live(){const x=e1(+$('kg').value,+$('reps').value);$('e1').textContent=x?'1RM estimado: '+Math.round(x*10)/10+' kg':''}
$('kg').oninput=$('reps').oninput=live;$('plt').onclick=()=>{$('pl').textContent=plates(+$('kg').value)};
$('nt').onchange=()=>{D.notes=D.notes||{};D.notes[$('ex').value]=$('nt').value.slice(0,300);store.set(D)};
$('add').onclick=()=>{const kg=+$('kg').value,reps=+$('reps').value,ex=$('ex').value;if(!reps){$('msg').textContent='Indica as repetições.';return}
 const old=D.sets.filter(s=>s.ex===ex&&s.kg>0),pk=Math.max(0,...old.map(s=>s.kg)),pe=Math.max(0,...old.map(s=>e1(s.kg,s.reps)));
 const pr=kg>0&&old.length&&(kg>pk||e1(kg,reps)>pe+0.01);
 D.sets.push({d:today(),t:Date.now(),plan:$('plan').value,ex,kg,reps,rpe:+$('rpe').value||null});store.set(D);
 $('msg').innerHTML=pr?'Guardado ✔ <span class="pr">🏆 Novo recorde!</span>':'Guardado ✔';$('reps').value='';live();render();startTimer(90)};
function sets(d){return D.sets.filter(s=>s.d===d)}
function render(){
 $('today').innerHTML=sets(today()).map((s,i)=>`<div class="item"><span><b>${s.ex}</b> · ${s.kg} kg × ${s.reps}${s.rpe?' · RPE '+s.rpe:''}</span><button class="btn bad" onclick="del(${s.t})">✕</button></div>`).join('')||'<span class="mut">Ainda sem séries hoje.</span>';
 const ws=weekStart(),cnt={};MUS.forEach(m=>cnt[m[0]]=0);D.sets.filter(s=>s.d>=ws).forEach(s=>{const m=muscle(s.ex);if(m)cnt[m]++});
 $('wk').innerHTML=MUS.map(m=>{const n=cnt[m[0]],c=n>=10?'#3ddc97':n>=5?'#ffb84a':'#4aa3ff';return '<div class="mb"><span>'+m[0]+'</span><div class="tr"><i style="width:'+Math.min(100,n/20*100)+'%;background:'+c+'"></i></div><b>'+n+'</b></div>'}).join('');
 const best={};D.sets.filter(s=>s.kg>0).forEach(s=>{const v=e1(s.kg,s.reps);if(!best[s.ex]||v>best[s.ex].v)best[s.ex]={v,s}});
 $('prs').innerHTML=Object.entries(best).sort((a,b)=>b[1].v-a[1].v).map(([ex,b])=>'<div class="item"><span><b>'+ex+'</b><br><span class="mut">'+b.s.d+'</span></span><span>'+b.s.kg+' kg × '+b.s.reps+'<br><span class="mut">1RM est. '+Math.round(b.v*10)/10+' kg</span></span></div>').join('')||'<span class="mut">Ainda sem recordes: regista séries com carga.</span>';
 const days=[...new Set(D.sets.map(s=>s.d))].sort().reverse();
 $('h1').textContent=days.length;$('h2').textContent=D.sets.length;$('h3').textContent=Math.round(D.sets.reduce((a,s)=>a+s.kg*s.reps,0));
 $('hl').innerHTML=days.slice(0,10).map(d=>{const x=sets(d);return `<div class="item"><span><b>${d}</b><br><span class="mut">${[...new Set(x.map(s=>s.ex))].join(', ')}</span></span><span class="mut">${x.length} séries</span></div>`}).join('')||'<span class="mut">Sem histórico.</span>';
 const w=D.weights.slice().sort((a,b)=>a.d<b.d?-1:1),last=w.length?w[w.length-1].w:null;
 $('s1').textContent=last?last+' kg':'–';$('s2').textContent=D.goal?D.goal+' kg':'–';$('s3').textContent=last&&D.goal?(Math.abs(D.goal-last)).toFixed(1)+' kg':'–';
 if(D.goal)$('goal').value=D.goal;draw(w)}
window.del=t=>{D.sets=D.sets.filter(s=>s.t!==t);store.set(D);render()};
$('addw').onclick=()=>{const w=+$('w').value;if(!w)return;D.weights=D.weights.filter(x=>x.d!==($('wd').value||today()));D.weights.push({d:$('wd').value||today(),w});store.set(D);$('w').value='';render()};
$('goal').onchange=()=>{D.goal=+$('goal').value||null;store.set(D);render()};
function draw(w){const c=$('cv'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);if(w.length<1)return;
 const vals=w.map(x=>x.w).concat(D.goal?[D.goal]:[]),mn=Math.min(...vals)-1,mx=Math.max(...vals)+1,X=i=>30+i*(c.width-50)/Math.max(1,w.length-1),Y=v=>c.height-20-(v-mn)/(mx-mn)*(c.height-40);
 g.strokeStyle='#2a2f3a';g.fillStyle='#8b93a5';g.font='12px sans-serif';for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3,y=Y(v);g.beginPath();g.moveTo(28,y);g.lineTo(c.width,y);g.stroke();g.fillText(v.toFixed(0),2,y+4)}
 if(D.goal){g.strokeStyle='#ffb84a';g.setLineDash([6,5]);g.beginPath();g.moveTo(28,Y(D.goal));g.lineTo(c.width,Y(D.goal));g.stroke();g.setLineDash([])}
 g.strokeStyle='#3ddc97';g.lineWidth=2.5;g.beginPath();w.forEach((p,i)=>i?g.lineTo(X(i),Y(p.w)):g.moveTo(X(i),Y(p.w)));g.stroke();
 g.fillStyle='#3ddc97';w.forEach((p,i)=>{g.beginPath();g.arc(X(i),Y(p.w),4,0,7);g.fill()})}
let left=90,iv=null;const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function startTimer(s){left=s;clearInterval(iv);$('clock').textContent=fmt(left);iv=setInterval(()=>{left--;$('clock').textContent=fmt(Math.max(0,left));
 if(left<=0){clearInterval(iv);$('clock').textContent='Pronto! 💪';try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}},1000)}
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{left=+b.dataset.s;$('clock').textContent=fmt(left)});
$('go').onclick=()=>startTimer(left>0?left:90);$('stop').onclick=()=>{clearInterval(iv)};
$('exp').onclick=()=>{const t=JSON.stringify(D,null,1);navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>alert('Copiado.'),()=>alert(t))};
$('clr').onclick=()=>{if(confirm('Apagar todos os dados?')){D={sets:[],weights:[],goal:null,notes:{}};store.set(D);render()}};
$('wd').value=today();render();fetch(API).then(r=>r.json()).then(j=>{D={sets:j.sets||[],weights:j.weights||[],goal:j.goal||null,notes:j.notes||{}};render();exInfo()}).catch(()=>{});
</script></body></html>
