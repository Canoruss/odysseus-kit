<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Segoe UI,Inter,system-ui,sans-serif" font-size="14"><rect x="0" y="0" width="640" height="360" rx="14" fill="#11151c"/>
<rect x="0" y="0" width="640" height="34" rx="14" fill="#1c222d"/><rect x="0" y="20" width="640" height="14" fill="#1c222d"/>
<circle cx="20" cy="17" r="5" fill="#ff5f57"/><circle cx="38" cy="17" r="5" fill="#febc2e"/><circle cx="56" cy="17" r="5" fill="#28c840"/>
<text x="320.0" y="22" text-anchor="middle" fill="#8b94a5" font-size="12">PowerShell (Administrador / Administrator)</text><rect x="20" y="50" width="600" height="290" rx="8" fill="#0b0e13"/><text x="36" y="80" fill="#7ee787" font-size="14" font-weight="400" text-anchor="start" font-family="Consolas,Menlo,monospace">PS C:\WINDOWS\system32> wsl --install -d Ubuntu</text><rect x="30" y="62" width="420" height="26" rx="8" fill="none" stroke="#4da3ff" stroke-width="3" stroke-dasharray="7 4"/><circle cx="470" cy="76" r="13" fill="#4da3ff"/><text x="470" y="81" text-anchor="middle" fill="#071018" font-size="14" font-weight="700">1</text><text x="36" y="114" fill="#8b94a5" font-size="13" font-weight="400" text-anchor="start" font-family="Consolas,Menlo,monospace">A instalar o Ubuntu… / Installing Ubuntu…</text><text x="36" y="140" fill="#febc2e" font-size="13" font-weight="400" text-anchor="start" font-family="Consolas,Menlo,monospace">Reinicie o computador quando pedido / Restart when asked</text><circle cx="560" cy="136" r="13" fill="#4da3ff"/><text x="560" y="141" text-anchor="middle" fill="#071018" font-size="14" font-weight="700">2</text><text x="36" y="200" fill="#dfe5ef" font-size="14" font-weight="400" text-anchor="start">Depois abra o menu Iniciar → «Ubuntu»</text><text x="36" y="222" fill="#dfe5ef" font-size="14" font-weight="400" text-anchor="start">Then open Start menu → “Ubuntu”, create a user and a password</text><circle cx="36" cy="262" r="13" fill="#4da3ff"/><text x="36" y="267" text-anchor="middle" fill="#071018" font-size="14" font-weight="700">3</text><text x="60" y="267" fill="#dfe5ef" font-size="13" font-weight="400" text-anchor="start">Cole o comando do passo seguinte lá dentro / Paste the next command there</text></svg>