function img(n){return `<img src="img/${n}.svg" alt="">`}
function render(){
 ver.textContent='Odysseus Desktop '+(info.version||'');
 const top=`<div class="top"><div class="logo"><b>O</b>dysseus</div>${langBar()}</div>`;let b='';
 if(V=='home')b=`<h1>Odysseus</h1><p>${tr('sub')}</p><div class="cards"><button class="card" onclick="go('have')"><h3>${tr('have')}</h3><p>${tr('have_d')}</p></button><button class="card" onclick="go('where')"><h3>${tr('none')}</h3><p>${tr('none_d')}</p></button></div>${info.server?`<p style="margin-top:22px"><a class="lnk" onclick="inv('retry_server')">${esc(info.server)} →</a></p>`:''}`;
 if(V=='have')b=`<h1>${tr('h_have')}</h1><p>${tr('h_have_d')}</p><label>${tr('addr')}</label><input type="text" id="addr" placeholder="${tr('ph')}" value="${esc(prefill)}" autofocus onkeydown="if(event.key=='Enter')verify()"><div class="row" style="margin-top:12px"><button class="btn" id="vb" onclick="verify()">${tr('verify')}</button></div><div id="vm"></div>
 <h2>${tr('where_ip')}</h2><div class="tabs">${[['ts','w_ts'],['lan','w_lan'],['cl','w_cloud']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()">${tr(l)}</button>`).join('')}</div>
 <div class="step"><p>1. ${tr(tab+'1')}</p><p>2. ${tr(tab+'2')}</p>${img({ts:'ip-tailscale',lan:'ip-local',cl:'ip-oracle'}[tab])}</div><div class="row end"><button class="btn sec" onclick="go('home')">${tr('back')}</button></div>`;
 if(V=='where')b=`<h1>${tr('h_where')}</h1><div class="cards"><button class="card" onclick="mode='pc';go('guide')"><h3>${tr('pc')}</h3><p>${tr('pc_d')}</p></button><button class="card" onclick="mode='srv';go('guide')"><h3>${tr('srv')}</h3><p>${tr('srv_d')}</p></button></div><div class="row end"><button class="btn sec" onclick="go('home')">${tr('back')}</button></div>`;
 if(V=='guide'){const S=mode=='srv'?[['s1','oracle-create',1],['s2','oracle-create',0],['s3','oracle-ports',0],['s4','ssh-connect',0]]:[['p1','wsl-install'],['p2'],['p3']];
  b=`<h1>${tr(mode=='srv'?'h_srv':'h_pc')}</h1><p>${tr(mode=='srv'?'h_srv_d':'h_pc_d')}</p>`+
  (mode=='srv'?`<div class="step"><h3><i>1</i>${tr('s1')}</h3><p>${tr('s1d')}</p><button class="btn sec" data-href="https://www.oracle.com/cloud/free/">${tr('open_oracle')}</button></div><div class="step"><h3><i>2</i>${tr('s2')}</h3><p>${tr('s2d')}</p>${img('oracle-create')}</div><div class="step"><h3><i>3</i>${tr('s3')}</h3><p>${tr('s3d')}</p>${img('oracle-ports')}</div><div class="step"><h3><i>4</i>${tr('s4')}</h3><p>${tr('s4d')}</p>${img('ssh-connect')}</div>`
  :`<div class="step"><h3><i>1</i>${tr('p1')}</h3><p>${tr('p1d')}</p>${img('wsl-install')}</div><div class="step"><h3><i>2</i>${tr('p2')}</h3><p>${tr('p2d')}</p><button class="btn sec" data-href="https://www.docker.com/products/docker-desktop/">Docker Desktop</button></div><div class="step"><h3><i>3</i>${tr('p3')}</h3><p>${tr('p3d')}</p></div>`)+
  `<div class="row end"><button class="btn sec" onclick="go('where')">${tr('back')}</button><button class="btn" onclick="go('keys')">${tr('next')}</button></div>`}
 if(V=='keys'){const prov=p=>{const k=keys[p.id]||{};return `<div class="prov"><div class="h"><div><b>${p.name}</b><div class="why">${tr(p.w)}</div></div>${p.link?`<a class="lnk" data-href="${p.link}">${tr('get')}</a>`:''}</div>
   ${p.custom?`<label>${tr('url')}</label><input type="text" value="${esc(k.url||'')}" placeholder="https://…/v1" oninput="setk('${p.id}','url',this.value)">`:''}
   <label>${tr('key')}${p.step&&p.step.f?'':''}</label><div class="row" style="flex-wrap:nowrap"><input type="password" autocomplete="off" value="${esc(k.key||'')}" oninput="setk('${p.id}','key',this.value)">${p.test?`<button class="btn sec" onclick="tk('${p.id}','${p.test}')">${tr('test')}</button>`:''}</div>
   ${p.extra?`<label>${tr(p.extra.l)}</label><input type="text" value="${esc(k.extra||'')}" oninput="setk('${p.id}','extra',this.value)">`:''}
   <div id="t_${p.id}">${res[p.id]===true?`<div class="msg ok">${tr('good')}</div>`:res[p.id]===false?`<div class="msg bad">${tr('bad')}</div>`:''}</div></div>`};
  b=`<h1>${tr('h_keys')}</h1><p>${tr('h_keys_d')}</p><h2>${tr('models')}</h2>${PROV.map(prov).join('')}<h2>${tr('tabs')}</h2>${TABS.map(prov).join('')}<div class="row end"><button class="btn sec" onclick="go('guide')">${tr('back')}</button><button class="btn" onclick="go('cmd')">${tr('next')}</button></div>`}
 if(V=='cmd')b=`<h1>${tr('h_cmd')}</h1><p>${tr('h_cmd_d')}</p><label>${tr('admin')}</label><input type="text" id="adm" value="${esc(keys._admin||'admin')}" oninput="keys._admin=this.value.toLowerCase().replace(/[^a-z0-9_-]/g,'');save();showCmd()"><div class="step" style="margin-top:16px"><p>${tr(mode=='srv'?'c_srv':'c_pc')}</p>${img(mode=='srv'?'paste-install':'wsl-install')}<pre id="cmd"></pre><div class="row"><button class="btn" onclick="copyCmd()" id="cb">${tr('copy')}</button></div><p class="small" style="margin-top:10px">${tr('sens')}</p></div><div class="row end"><button class="btn sec" onclick="go('keys')">${tr('back')}</button><button class="btn" onclick="prefill=mode=='pc'?'http://localhost:8080':'';go('have')">${tr('done')}</button></div>`;
 m.innerHTML=top+b;if(V=='cmd')showCmd();
}
function setk(id,f,v){(keys[id]=keys[id]||{})[f]=v;if(f=='key')delete res[id];save()}
async function tk(id,kind){const v=(keys[id]||{}).key||'';const el=document.getElementById('t_'+id);el.innerHTML='<div class="msg info">…</div>';try{res[id]=await inv('test_key',{kind,value:v})}catch(e){res[id]=false}render()}
function payload(){const steps={},models=[];
 for(const p of PROV){const k=keys[p.id]||{};if(!(k.key||'').trim())continue;
  const url=p.custom?(k.url||'').trim():p.url;if(url)models.push({name:p.name,base_url:url,api_key:k.key.trim()});
  if(p.step)steps[p.step.id]={[p.step.f]:k.key.trim()}}
 for(const p of TABS){const k=keys[p.id]||{};if(!(k.key||'').trim())continue;const s={[p.f]:k.key.trim()};if(p.extra&&k.extra)s[p.extra.k]=k.extra.trim();steps[p.step]=s}
 let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){}
 return {timezone:tz,steps,models}}
function command(){const adm=(keys._admin||'admin')||'admin';const tz=payload().timezone;
 return `cat > ~/odysseus-keys.json <<'ODYSSEUS_KEYS'\n${JSON.stringify(payload(),null,2)}\nODYSSEUS_KEYS\nchmod 600 ~/odysseus-keys.json\n[ -d odysseus-kit ] || git clone https://github.com/Canoruss/odysseus-kit\nbash odysseus-kit/install/install.sh --keys-file ~/odysseus-keys.json --admin-user ${adm}${tz?' --timezone '+tz:''}${mode=='pc'?' --local':''}\nhistory -c`}
function showCmd(){const e=document.getElementById('cmd');if(e)e.textContent=command()}
async function copyCmd(){try{await navigator.clipboard.writeText(command())}catch(e){const r=document.createRange();r.selectNode(document.getElementById('cmd'));getSelection().removeAllRanges();getSelection().addRange(r);document.execCommand('copy')}const b=document.getElementById('cb');b.textContent=tr('copied');setTimeout(()=>b.textContent=tr('copy'),1500)}
async function verify(){const v=document.getElementById('addr').value;const o=document.getElementById('vm'),b=document.getElementById('vb');b.disabled=true;o.innerHTML=`<div class="msg info">${tr('checking')}</div>`;
 try{const r=await inv('check_server',{input:v});o.innerHTML=`<div class="msg ok">${tr('ok')}</div>`+(r.secure?'':`<div class="msg warn">${tr('insecure')}</div>`);setTimeout(()=>inv('save_server',{url:r.url}),r.secure?600:2600)}
 catch(e){const k=String(e);o.innerHTML=`<div class="msg bad">${tr(k=='invalid'?'e_invalid':k=='not_odysseus'?'e_not_odysseus':'e_unreachable')}</div>`;b.disabled=false}}
(async()=>{try{info=await inv('app_info')}catch(e){}if(info.server&&new URLSearchParams(location.search).get('change')==null){}render()})();
</script>
