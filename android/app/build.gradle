apply plugin: 'com.android.application'

def ksProps = new Properties()
def ksFile = rootProject.file("keystore.properties")
if (ksFile.exists()) {
    ksFile.withInputStream { ksProps.load(it) }
}

android {
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    namespace "com.canorus.odysseus"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.canorus.odysseus"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Bump versionCode on every release so Android upgrades in-place without uninstalling.
        // Can also override via CLI: ./gradlew assembleRelease -PversionCode=55 -PversionName=1.51
        versionCode(project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 63)
        versionName(project.hasProperty('versionName') ? project.property('versionName').toString() : "1.58")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    packagingOptions {
        resources {
            excludes += [
                'DebugProbesKt.bin',
                'META-INF/*.kotlin_module',
                'META-INF/version-control-info.textproto',
                'kotlin-tooling-metadata.json'
            ]
        }
    }
    buildTypes {
        debug {
            // Sign debug builds with the same release keystore when available so installing
            // a local test build over a release build never triggers signature-mismatch uninstalls!
            if (ksFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                applicationIdSuffix ".publictest"
            }
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            // Phones are arm64; keeps native libraries (~17 MB per ABI) out of other ABIs.
            ndk { abiFilters 'arm64-v8a' }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Fail fast if building a release APK without keystore.properties so a mismatched-signature APK
// is never generated by accident (which is what forces Android to require uninstalling first).
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains("release") } && !ksFile.exists()) {
        throw new GradleException(
            "Missing android/keystore.properties! Refusing to build an unsigned/mismatched release APK " +
            "because Android requires identical signing keys for in-place upgrades without uninstalling."
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.work:work-runtime:2.9.1"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Build the native Rust library before packaging it in the APK.
def rustVoice = tasks.register('buildRustVoice', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'bash', './build-voice.sh'
    inputs.files(fileTree('../../voice-core/src'), file('../../voice-core/Cargo.toml'), file('../../voice-core/Cargo.lock'), file('../../build-voice.sh'))
    outputs.files('src/main/jniLibs/arm64-v8a/libodysseus_voice.so',
            'src/main/jniLibs/armeabi-v7a/libodysseus_voice.so',
            'src/main/jniLibs/x86/libodysseus_voice.so',
            'src/main/jniLibs/x86_64/libodysseus_voice.so')
}
tasks.named('preBuild').configure { dependsOn rustVoice }
